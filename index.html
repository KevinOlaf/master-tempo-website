  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

1, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Master Tempo Pro — Website\n   A web translation of the studio rack-gear app language:\n   machined matte-black metal, milled hairlines, silk-screened\n   mono plates, one emerald power-LED. Archivo + JetBrains Mono.\n   ============================================================ */\n\n:root {\n  --bg:        #050505;\n  --bg-2:      #070809;\n  --face-hi:   #1b1d1f;\n  --face-lo:   #0a0b0c;\n  --recess-hi: #101113;\n  --recess-lo: #060708;\n\n  --edge-light: rgba(255,255,255,.075);\n  --edge-soft:  rgba(255,255,255,.035);\n  --edge-dark:  rgba(0,0,0,.72);\n\n  --txt:      #eef1f2;\n  --txt-2:    #aab0b3;\n  --txt-dim:  #6b7174;\n  --txt-faint:#474c4f;\n\n  --led:      #3ee68d;\n  --led-deep: #16c06a;\n  --led-glow: rgba(56,226,138,.55);\n  --led-haze: rgba(40,200,120,.16);\n\n  --fs-display: \"Archivo\", system-ui, sans-serif;\n  --fs-mono: \"JetBrains Mono\", ui-monospace, monospace;\n\n  --maxw: 1180px;\n}\n\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background:\n    radial-gradient(120% 70% at 50% -8%, #15181a 0%, #0a0b0c 44%, #050505 100%);\n  color: var(--txt);\n  font-family: var(--fs-display);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow-x: hidden;\n}\n/* fine brushed grain + faint emerald rise */\nbody::before {\n  content: \"\";\n  position: fixed; inset: 0;\n  pointer-events: none; z-index: 0;\n  background-image:\n    repeating-linear-gradient(90deg, rgba(255,255,255,.011) 0 1px, rgba(0,0,0,0) 1px 3px),\n    radial-gradient(80% 50% at 50% 100%, var(--led-haze), rgba(0,0,0,0) 60%);\n  mix-blend-mode: screen;\n  opacity: .7;\n}\n.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; position: relative; z-index: 1; }\n\n/* milled hairline divider used between sections */\n.milled {\n  height: 1px; border: 0; margin: 0;\n  background: rgba(0,0,0,.6);\n  box-shadow: 0 1px 0 var(--edge-light);\n}\n\n/* engraved type helpers */\n.engrave { text-shadow: 0 1px 0 rgba(0,0,0,.6), 0 -1px 0 rgba(255,255,255,.05); }\n\n/* silk-screened section eyebrow: led tick + mono label + milled rule */\n.eyebrow {\n  display: flex; align-items: center; gap: 11px;\n  margin: 0 0 18px;\n  font: 600 12px/1 var(--fs-mono);\n  letter-spacing: 3px; text-transform: uppercase;\n  color: var(--txt-faint);\n}\n.eyebrow > span:not(.rule) { white-space: nowrap; }\n.eyebrow .tick {\n  flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%;\n  background: radial-gradient(circle at 36% 30%, #c4ffe0, var(--led) 55%, var(--led-deep));\n  box-shadow: 0 0 6px var(--led-glow), inset 0 0 0 .5px rgba(255,255,255,.3);\n  animation: ledBreath 3.4s ease-in-out infinite;\n}\n.eyebrow .rule {\n  flex: 1 1 auto; height: 1px;\n  background: linear-gradient(90deg, var(--edge-light), rgba(255,255,255,0));\n  box-shadow: 0 1px 0 rgba(0,0,0,.5);\n}\n\n@keyframes ledBreath {\n  0%, 100% { opacity: 1; filter: brightness(1); }\n  50%      { opacity: .55; filter: brightness(.7); }\n}\n.no-motion .eyebrow .tick,\n.no-motion .led-dot,\n.no-motion .pulse-ring { animation: none !important; }\n\n/* ============================================================\n   TOP RAIL / NAV\n   ============================================================ */\n.rail {\n  position: sticky; top: 0; z-index: 50;\n  background: linear-gradient(180deg, rgba(20,22,24,.92), rgba(8,9,10,.92));\n  backdrop-filter: blur(14px) saturate(1.1);\n  -webkit-backdrop-filter: blur(14px) saturate(1.1);\n  box-shadow: inset 0 -1px 0 var(--edge-light), 0 1px 0 rgba(0,0,0,.6), 0 6px 18px rgba(0,0,0,.4);\n}\n.rail-in {\n  max-width: var(--maxw); margin: 0 auto; padding: 0 28px;\n  height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 20px;\n}\n.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }\n.brand-badge {\n  width: 34px; height: 34px; border-radius: 9px; position: relative; flex: 0 0 auto;\n  background: conic-gradient(from 210deg, #2a2d30, #15171a, #303437, #14161a, #2a2d30);\n  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -2px 3px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.5);\n  display: grid; place-items: center;\n}\n.brand-badge::after {\n  content: \"\"; width: 9px; height: 9px; border-radius: 50%;\n  background: radial-gradient(circle at 36% 30%, #c4ffe0, var(--led) 55%, var(--led-deep));\n  box-shadow: 0 0 7px var(--led-glow), 0 0 14px rgba(40,200,120,.4);\n  animation: ledBreath 3.4s ease-in-out infinite;\n}\n.brand-name { display: block; font: 800 15px/1 var(--fs-display); letter-spacing: .3px; color: #eef1f2; }\n.brand-name b { color: var(--led); font-weight: 800; }\n.brand-sub { display: block; font: 500 9.5px/1 var(--fs-mono); letter-spacing: 2px; color: var(--txt-faint); margin-top: 5px; text-transform: uppercase; white-space: nowrap; }\n\n.rail-nav { display: flex; align-items: center; gap: 26px; }\n.rail-link {\n  font: 600 12px/1 var(--fs-mono); letter-spacing: 1.5px; text-transform: uppercase;\n  color: var(--txt-dim); text-decoration: none; transition: color .15s;\n}\n.rail-link:hover { color: var(--txt); }\n\n/* ============================================================\n   PHYSICAL KEY (CTA button family)\n   ============================================================ */\n.key {\n  display: inline-flex; align-items: center; justify-content: center; gap: 10px;\n  border: none; cursor: pointer; text-decoration: none;\n  font: 800 14px/1 var(--fs-display); letter-spacing: .2px;\n  color: #062414; border-radius: 12px; padding: 12px 18px;\n  background: linear-gradient(180deg, #5cf0a4 0%, #34dd84 46%, #1fbf6e 100%);\n  box-shadow:\n    inset 0 1px 0 rgba(255,255,255,.55),\n    inset 0 -2px 3px rgba(0,40,20,.5),\n    0 5px 14px rgba(20,170,100,.32),\n    0 0 0 1px rgba(20,150,90,.5),\n    0 0 20px var(--led-haze);\n  text-shadow: 0 1px 0 rgba(255,255,255,.35);\n  transition: transform .1s, box-shadow .1s, filter .1s;\n}\n.key:hover { filter: brightness(1.05); }\n.key:active { transform: translateY(2px); box-shadow: inset 0 2px 4px rgba(0,40,20,.55), inset 0 1px 0 rgba(255,255,255,.3), 0 2px 8px rgba(20,170,100,.3), 0 0 0 1px rgba(20,150,90,.5); }\n.key svg { display: block; }\n.key .key-sub { font: 600 9px/1.1 var(--fs-mono); letter-spacing: .5px; opacity: .8; }\n.key-store { flex-direction: row; padding: 13px 22px 13px 18px; text-align: left; }\n.key-store .store-stack { display: flex; flex-direction: column; gap: 2px; }\n.key-store .store-stack .s1 { font: 600 9px/1 var(--fs-mono); letter-spacing: 1px; text-transform: uppercase; opacity: .82; }\n.key-store .store-stack .s2 { font: 800 17px/1 var(--fs-display); letter-spacing: .2px; }\n.key-lg { padding: 17px 30px 17px 24px; border-radius: 15px; }\n.key-lg .store-stack .s2 { font-size: 20px; }\n\n/* neutral (metal) key */\n.key-ghost {\n  color: var(--txt); background: linear-gradient(180deg, #1b1d1f, #0e0f11);\n  box-shadow: inset 0 1px 0 var(--edge-light), inset 0 -2px 3px rgba(0,0,0,.7), 0 3px 8px rgba(0,0,0,.5);\n  text-shadow: none;\n}\n.key-ghost:hover { filter: brightness(1.12); }\n.key-sm { padding: 9px 15px; font-size: 12.5px; border-radius: 10px; }\n\n/* ============================================================\n   HERO — full rack faceplate\n   ============================================================ */\n.hero { padding: 54px 0 30px; position: relative; }\n\n/* the mounted unit */\n.faceplate {\n  position: relative;\n  border-radius: 26px;\n  padding: 40px;\n  background:\n    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, rgba(0,0,0,0) 1px 3px),\n    linear-gradient(180deg, #191c1e 0%, #101315 46%, #0a0c0d 100%);\n  box-shadow:\n    inset 0 1px 0 rgba(255,255,255,.09),\n    inset 0 -2px 6px rgba(0,0,0,.7),\n    inset 0 0 0 1px rgba(255,255,255,.025),\n    0 30px 80px rgba(0,0,0,.6),\n    0 2px 0 rgba(0,0,0,.5);\n}\n/* top vent slots */\n.faceplate::before {\n  content: \"\";\n  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);\n  width: 120px; height: 7px; border-radius: 4px;\n  background: repeating-linear-gradient(90deg, rgba(0,0,0,.55) 0 3px, rgba(255,255,255,.05) 3px 6px);\n  box-shadow: inset 0 1px 2px rgba(0,0,0,.8);\n  opacity: .6;\n}\n/* corner screws */\n.faceplate .screw {\n  position: absolute; width: 16px; height: 16px; border-radius: 50%;\n  background: radial-gradient(circle at 38% 32%, #2c2f32, #0c0d0e 75%);\n  box-shadow: inset 0 1px 1px rgba(255,255,255,.18), inset 0 -1px 2px rgba(0,0,0,.8), 0 1px 1px rgba(0,0,0,.5);\n}\n.faceplate .screw::after {\n  content: \"\"; position: absolute; left: 50%; top: 50%;\n  width: 9px; height: 1.6px; background: rgba(0,0,0,.6);\n  box-shadow: 0 1px 0 rgba(255,255,255,.06);\n  transform: translate(-50%,-50%) rotate(var(--r, 30deg)); border-radius: 1px;\n}\n.faceplate .screw.tl { top: 14px; left: 14px; --r: 28deg; }\n.faceplate .screw.tr { top: 14px; right: 14px; --r: -42deg; }\n.faceplate .screw.bl { bottom: 14px; left: 14px; --r: 62deg; }\n.faceplate .screw.br { bottom: 14px; right: 14px; --r: -18deg; }\n\n/* ---- DIRECTION A : mounted unit, text left / phone bay right ---- */\n.hero-a .face-grid {\n  display: grid; grid-template-columns: 1.05fr .95fr; gap: 30px; align-items: center;\n  padding: 14px 18px;\n}\n\n/* engraved id plate above the headline */\n.id-plate {\n  display: inline-flex; align-items: center; gap: 12px;\n  padding: 8px 14px; border-radius: 9px; margin-bottom: 22px;\n  background: linear-gradient(180deg, var(--recess-lo), var(--recess-hi));\n  box-shadow: inset 0 2px 5px rgba(0,0,0,.8), inset 0 -1px 0 var(--edge-soft), 0 1px 0 var(--edge-light);\n}\n.id-plate .led-dot {\n  width: 9px; height: 9px; border-radius: 50%;\n  background: radial-gradient(circle at 36% 30%, #c4ffe0, var(--led) 55%, var(--led-deep));\n  box-shadow: 0 0 7px var(--led-glow), 0 0 14px rgba(40,200,120,.4);\n  animation: ledBreath 3.4s ease-in-out infinite;\n}\n.id-plate span {\n  font: 600 11px/1 var(--fs-mono); letter-spacing: 2.4px; text-transform: uppercase; color: var(--txt-2); white-space: nowrap;\n}\n\n.hero h1 {\n  margin: 0; font: 900 clamp(40px, 5.4vw, 70px)/0.98 var(--fs-display);\n  letter-spacing: -1.6px; color: #f4f6f7; text-wrap: balance;\n}\n.hero h1 .em { color: var(--led); text-shadow: 0 0 30px rgba(40,200,120,.35); }\n.hero-lede {\n  margin: 18px 0 0; max-width: 30ch;\n  font: 400 clamp(16px, 1.5vw, 19px)/1.5 var(--fs-display); color: var(--txt-dim); text-wrap: pretty;\n}\n\n/* engraved feature channels (hero bullets) */\n.hero-specs { list-style: none; margin: 26px 0 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }\n.hero-specs li {\n  display: flex; align-items: center; gap: 12px;\n  font: 500 14px/1.3 var(--fs-mono); letter-spacing: .2px; color: var(--txt-2);\n}\n.hero-specs li .chk {\n  flex: 0 0 auto; width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center;\n  color: var(--led);\n  background: linear-gradient(180deg, #0a110d, #060907);\n  box-shadow: inset 0 1px 0 rgba(56,226,138,.18), inset 0 -1px 2px rgba(0,0,0,.8), inset 0 0 0 1px rgba(56,226,138,.16);\n}\n.hero-specs li .chk svg { width: 11px; height: 11px; }\n\n.hero-cta { margin-top: 32px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }\n.hero-cta .req { font: 500 11px/1.4 var(--fs-mono); letter-spacing: .6px; text-transform: uppercase; color: var(--txt-faint); }\n\n/* phone bay — recessed chrome well holding the live screen */\n.phone-bay {\n  position: relative; border-radius: 22px; padding: 26px;\n  display: grid; place-items: center;\n  background:\n    repeating-linear-gradient(135deg, rgba(255,255,255,.02) 0 2px, rgba(0,0,0,0) 2px 10px),\n    radial-gradient(120% 120% at 50% 20%, #131517, #060707);\n  box-shadow: inset 0 3px 10px rgba(0,0,0,.85), inset 0 -1px 0 var(--edge-soft), inset 0 0 0 1px rgba(255,255,255,.03);\n}\n/* emerald wash rising behind the phone */\n.phone-bay::after {\n  content: \"\"; position: absolute; left: 50%; bottom: -10%; width: 80%; height: 70%;\n  transform: translateX(-50%); border-radius: 50%;\n  background: radial-gradient(circle, var(--led-haze), rgba(0,0,0,0) 70%);\n  pointer-events: none;\n}\n\n/* ---- the phone frame ---- */\n.phone {\n  --scale: .7;\n  position: relative; z-index: 2;\n  padding: 11px; border-radius: 50px;\n  background: linear-gradient(150deg, #303437 0%, #16181a 30%, #0c0d0e 55%, #232629 100%);\n  box-shadow:\n    inset 0 1px 0 rgba(255,255,255,.22),\n    inset 0 -2px 4px rgba(0,0,0,.8),\n    0 24px 50px rgba(0,0,0,.6),\n    0 0 0 1px rgba(0,0,0,.6);\n}\n.phone-screen {\n  position: relative; overflow: hidden; border-radius: 40px;\n  width: calc(430px * var(--scale)); height: calc(932px * var(--scale));\n  background: #060707;\n  box-shadow: inset 0 0 0 1px rgba(0,0,0,.8);\n}\n.phone-screen iframe {\n  width: 430px; height: 932px; border: 0; display: block;\n  transform: scale(var(--scale)); transform-origin: top left;\n}\n/* loading shimmer under the iframe */\n.phone-screen::before {\n  content: \"LOADING\"; position: absolute; inset: 0; z-index: -1;\n  display: grid; place-items: center;\n  font: 600 11px/1 var(--fs-mono); letter-spacing: 3px; color: var(--txt-faint);\n}\n\n/* ---- DIRECTION B : console display, centered phone on plinth ---- */\n.hero-b { display: none; }\n.hero-b .face-grid {\n  display: flex; flex-direction: column; align-items: center; text-align: center;\n  padding: 28px 18px 18px; gap: 6px;\n}\n.hero-b .hero-lede { max-width: 44ch; }\n.hero-b .hero-specs { flex-flow: row wrap; justify-content: center; gap: 9px 18px; margin-top: 22px; }\n.hero-b .hero-cta { justify-content: center; }\n.hero-b .console-stage {\n  position: relative; margin-top: 30px; width: 100%;\n  display: grid; place-items: center; padding: 18px 0 6px;\n}\n/* breathing pulse rings behind the phone */\n.pulse-ring {\n  position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%);\n  width: 300px; height: 300px; border-radius: 50%;\n  border: 1.5px solid rgba(56,226,138,.4);\n  animation: pulseRing 3.6s ease-out infinite;\n  pointer-events: none;\n}\n.pulse-ring.r2 { animation-delay: 1.2s; }\n.pulse-ring.r3 { animation-delay: 2.4s; }\n@keyframes pulseRing {\n  0%   { transform: translate(-50%,-50%) scale(.5); opacity: .5; }\n  70%  { opacity: .12; }\n  100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; }\n}\n/* machined plinth under the phone */\n.console-stage .plinth {\n  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);\n  width: 60%; height: 26px; border-radius: 50%;\n  background: radial-gradient(closest-side, rgba(0,0,0,.7), rgba(0,0,0,0) 80%);\n}\n.hero-b.show .hero-a-only { display: none; }\n\n/* show the active hero */\nbody[data-hero-dir=\"b\"] .hero-a { display: block; }\nbody[data-hero-dir=\"b\"] .hero-b { display: none; }\nbody[data-hero-dir=\"b\"] .hero-a { display: none; }\nbody[data-hero-dir=\"b\"] .hero-b { display: block; }\n\n/* trust strip under hero */\n.trust {\n  display: flex; align-items: center; justify-content: center; gap: 26px; flex-wrap: wrap;\n  padding: 30px 0 6px;\n}\n.trust .t-item { display: flex; align-items: center; gap: 9px; font: 500 12px/1 var(--fs-mono); letter-spacing: 1px; text-transform: uppercase; color: var(--txt-faint); }\n.trust .t-item b { color: var(--txt-2); font-weight: 600; }\n.trust .t-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--txt-faint); }\n\n/* ============================================================\n   SECTION SHELL\n   ============================================================ */\n.section { padding: 78px 0; position: relative; }\n.section-head { max-width: 720px; }\n.section-title {\n  margin: 0; font: 800 clamp(30px, 3.6vw, 46px)/1.04 var(--fs-display);\n  letter-spacing: -1px; color: #f1f3f4; text-wrap: balance;\n}\n.section-title .em { color: var(--led); }\n.section-desc { margin: 16px 0 0; font: 400 17px/1.55 var(--fs-display); color: var(--txt-dim); max-width: 56ch; text-wrap: pretty; }\n\n/* ============================================================\n   FEATURES — recessed engraved modules\n   ============================================================ */\n.feature-grid {\n  margin-top: 44px;\n  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;\n}\n.feature {\n  position: relative; padding: 24px 22px 26px; border-radius: 16px;\n  background: linear-gradient(180deg, #131517, #0c0d0f);\n  box-shadow: inset 0 1px 0 var(--edge-light), inset 0 -2px 5px rgba(0,0,0,.7), 0 2px 5px rgba(0,0,0,.5);\n  transition: box-shadow .22s, transform .12s;\n}\n.feature:hover {\n  transform: translateY(-2px);\n  box-shadow: inset 0 1px 0 var(--edge-light), inset 0 -2px 5px rgba(0,0,0,.7), inset 0 0 0 1px rgba(56,226,138,.18), 0 8px 22px rgba(0,0,0,.55), 0 0 22px rgba(40,200,120,.08);\n}\n.feature-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }\n.feature-ico {\n  width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center;\n  color: var(--txt-2);\n  background: linear-gradient(180deg, #090a0b, #131517);\n  box-shadow: inset 0 2px 4px rgba(0,0,0,.85), inset 0 -1px 0 var(--edge-soft);\n  transition: color .22s, box-shadow .22s;\n}\n.feature-ico svg { width: 24px; height: 24px; }\n.feature:hover .feature-ico {\n  color: var(--led);\n  box-shadow: inset 0 2px 4px rgba(0,0,0,.85), inset 0 0 0 1px rgba(56,226,138,.22), 0 0 10px rgba(40,200,120,.18);\n}\n.feature-led {\n  width: 8px; height: 8px; border-radius: 50%;\n  background: radial-gradient(circle at 35% 30%, #1d2a23, #0c130f);\n  box-shadow: inset 0 1px 1px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.04);\n  transition: background .25s, box-shadow .25s;\n}\n.feature:hover .feature-led {\n  background: radial-gradient(circle at 35% 30%, #aaffd2, var(--led) 55%, var(--led-deep));\n  box-shadow: 0 0 7px var(--led-glow), 0 0 14px rgba(40,200,120,.4), inset 0 0 1px rgba(255,255,255,.8);\n}\n.feature h3 { margin: 0 0 8px; font: 700 19px/1.15 var(--fs-display); letter-spacing: -.2px; color: #eef1f2; }\n.feature p { margin: 0; font: 400 14.5px/1.55 var(--fs-display); color: var(--txt-dim); text-wrap: pretty; }\n.feature .idx {\n  position: absolute; top: 18px; right: 22px;\n  font: 600 10px/1 var(--fs-mono); letter-spacing: 1px; color: var(--txt-faint);\n}\n\n/* ============================================================\n   SHOWCASE — three live screens on a recessed bench\n   ============================================================ */\n.showcase-bench {\n  margin-top: 46px; position: relative;\n  border-radius: 24px; padding: 50px 30px 40px;\n  background:\n    repeating-linear-gradient(90deg, rgba(255,255,255,.01) 0 1px, rgba(0,0,0,0) 1px 3px),\n    radial-gradient(120% 90% at 50% 0%, #141618, #0a0b0c 70%);\n  box-shadow: inset 0 2px 8px rgba(0,0,0,.8), inset 0 -1px 0 var(--edge-soft), inset 0 0 0 1px rgba(255,255,255,.025), 0 20px 50px rgba(0,0,0,.5);\n}\n.showcase-row {\n  display: flex; align-items: flex-end; justify-content: center; gap: 30px; flex-wrap: wrap;\n}\n.showcase-item { display: flex; flex-direction: column; align-items: center; gap: 16px; }\n.showcase-item .phone { --scale: .52; }\n.showcase-item.lift { margin-bottom: 26px; }\n.showcase-cap { text-align: center; }\n.showcase-cap .c-label {\n  font: 600 11px/1 var(--fs-mono); letter-spacing: 2px; text-transform: uppercase; color: var(--led);\n  text-shadow: 0 0 8px rgba(40,200,120,.3);\n}\n.showcase-cap .c-name { margin-top: 7px; font: 700 16px/1.2 var(--fs-display); color: #eaedee; }\n\n/* ============================================================\n   TECH SPECS — engraved rear-panel plate\n   ============================================================ */\n.specs-plate {\n  margin-top: 44px; border-radius: 20px; overflow: hidden;\n  background: linear-gradient(180deg, var(--recess-lo), var(--recess-hi));\n  box-shadow: inset 0 2px 6px rgba(0,0,0,.82), inset 0 -1px 0 var(--edge-soft), 0 1px 0 var(--edge-light), 0 14px 40px rgba(0,0,0,.4);\n}\n.specs-grid { display: grid; grid-template-columns: repeat(2, 1fr); }\n.spec-cell {\n  position: relative; padding: 30px 32px;\n}\n.spec-cell:nth-child(odd) { box-shadow: inset -1px 0 0 rgba(0,0,0,.5), inset 1px 0 0 var(--edge-soft); }\n.spec-cell:nth-child(-n+2)::after {\n  content: \"\"; position: absolute; left: 24px; right: 24px; bottom: 0; height: 1px;\n  background: rgba(0,0,0,.55); box-shadow: 0 1px 0 var(--edge-soft);\n}\n.spec-label {\n  display: flex; align-items: center; gap: 9px;\n  font: 600 11px/1 var(--fs-mono); letter-spacing: 2.4px; text-transform: uppercase; color: var(--txt-faint);\n}\n.spec-label .s-tick { width: 5px; height: 5px; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #8fe9bd, var(--led-deep) 70%); box-shadow: 0 0 5px rgba(40,200,120,.4); }\n.spec-value { margin-top: 14px; font: 800 30px/1 var(--fs-display); letter-spacing: -.4px; color: #f1f3f4; }\n.spec-value .unit { font: 500 13px/1 var(--fs-mono); letter-spacing: .5px; color: var(--txt-dim); margin-left: 6px; }\n.spec-note { margin-top: 9px; font: 400 13px/1.45 var(--fs-display); color: var(--txt-dim); }\n\n/* ============================================================\n   FINAL CTA BAND\n   ============================================================ */\n.cta-band {\n  position: relative; margin: 20px 0 0; padding: 66px 40px; border-radius: 24px; text-align: center; overflow: hidden;\n  background: linear-gradient(180deg, #0d1411, #0a0f0d);\n  box-shadow:\n    inset 0 1px 0 rgba(56,226,138,.16), inset 0 -2px 6px rgba(0,0,0,.7),\n    inset 0 0 0 1px rgba(56,226,138,.14),\n    0 0 40px rgba(40,200,120,.08), 0 20px 50px rgba(0,0,0,.5);\n}\n.cta-band::before {\n  content: \"\"; position: absolute; left: 50%; top: -40%; width: 70%; height: 120%;\n  transform: translateX(-50%);\n  background: radial-gradient(closest-side, rgba(40,200,120,.14), rgba(0,0,0,0) 70%);\n  pointer-events: none;\n}\n.cta-band h2 {\n  position: relative; margin: 0; font: 800 clamp(30px, 4vw, 50px)/1.02 var(--fs-display);\n  letter-spacing: -1px; color: #fff; text-wrap: balance;\n}\n.cta-band h2 .em { color: var(--led); text-shadow: 0 0 30px rgba(40,200,120,.4); }\n.cta-band p { position: relative; margin: 16px auto 0; max-width: 48ch; font: 400 17px/1.5 var(--fs-display); color: var(--txt-2); }\n.cta-band .hero-cta { position: relative; justify-content: center; margin-top: 32px; }\n.cta-band .fineprint { position: relative; margin-top: 20px; font: 500 12px/1 var(--fs-mono); letter-spacing: 2px; text-transform: uppercase; color: var(--txt-faint); }\n\n/* ============================================================\n   FOOTER — engraved firmware plate\n   ============================================================ */\n.foot { padding: 56px 0 50px; }\n.foot-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 30px; flex-wrap: wrap; }\n.foot-links { display: flex; gap: 30px; flex-wrap: wrap; }\n.foot-links a { font: 600 12px/1 var(--fs-mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--txt-dim); text-decoration: none; transition: color .15s; }\n.foot-links a:hover { color: var(--led); }\n.foot-meta { margin-top: 30px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }\n.foot-fw { font: 500 11px/1.6 var(--fs-mono); letter-spacing: 1.4px; text-transform: uppercase; color: var(--txt-faint); }\n.foot-fw b { color: var(--txt-dim); font-weight: 600; }\n.foot-copy { font: 400 12px/1 var(--fs-mono); letter-spacing: .5px; color: var(--txt-faint); }\n\n/* ============================================================\n   SCROLL REVEAL\n   ============================================================ */\n/* base state is fully VISIBLE — the entrance only nudges position, never\n   opacity, so content can never be stuck hidden (transitions/animations are\n   sometimes frozen inside embedded previews). */\n.reveal { opacity: 1; transform: none; }\nhtml.anim .reveal {\n  transform: translateY(16px);\n  transition: transform .7s cubic-bezier(.2,.7,.2,1);\n}\nhtml.anim .reveal.in { transform: none; }\nhtml.anim .reveal.d1 { transition-delay: .06s; }\nhtml.anim .reveal.d2 { transition-delay: .12s; }\nhtml.anim .reveal.d3 { transition-delay: .18s; }\nhtml.anim .reveal.d4 { transition-delay: .24s; }\nhtml.anim .reveal.d5 { transition-delay: .30s; }\nhtml.show-all .reveal, .no-motion .reveal {\n  transform: none !important; transition: none !important;\n}\n@media (prefers-reduced-motion: reduce) {\n  html.anim .reveal { transform: none !important; transition: none; }\n  .eyebrow .tick, .led-dot, .pulse-ring, .brand-badge::after { animation: none !important; }\n}\n\n/* ============================================================\n   SUB-PAGES (Privacy / Support) — engraved document sheet\n   ============================================================ */\n.doc-wrap { max-width: 880px; margin: 0 auto; padding: 0 28px; position: relative; z-index: 1; }\n.doc-hero { padding: 60px 0 22px; }\n.doc-hero h1 {\n  margin: 0; font: 900 clamp(38px, 5vw, 60px)/1 var(--fs-display);\n  letter-spacing: -1.4px; color: #f4f6f7;\n}\n.doc-hero h1 .em { color: var(--led); text-shadow: 0 0 30px rgba(40,200,120,.32); }\n.doc-hero .lede { margin: 18px 0 0; max-width: 60ch; font: 400 18px/1.55 var(--fs-display); color: var(--txt-dim); text-wrap: pretty; }\n.doc-meta {\n  display: inline-flex; align-items: center; gap: 11px; margin-top: 24px;\n  padding: 9px 15px; border-radius: 10px;\n  background: linear-gradient(180deg, var(--recess-lo), var(--recess-hi));\n  box-shadow: inset 0 2px 5px rgba(0,0,0,.8), inset 0 -1px 0 var(--edge-soft), 0 1px 0 var(--edge-light);\n  font: 600 11px/1 var(--fs-mono); letter-spacing: 2px; text-transform: uppercase; color: var(--txt-dim);\n}\n.doc-meta span { white-space: nowrap; }\n.doc-meta .led-dot { width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #c4ffe0, var(--led) 55%, var(--led-deep)); box-shadow: 0 0 6px var(--led-glow); animation: ledBreath 3.4s ease-in-out infinite; }\n\n.doc { padding: 12px 0 40px; }\n.doc-section { margin-top: 40px; }\n.doc-section:first-child { margin-top: 14px; }\n.doc-section > h2 {\n  display: flex; align-items: center; gap: 12px; margin: 0 0 18px;\n  font: 700 13px/1.2 var(--fs-mono); letter-spacing: 2.6px; text-transform: uppercase; color: var(--txt-2);\n  white-space: nowrap;\n}\n.doc-section > h2 .n {\n  flex: 0 0 auto; font: 600 11px/1 var(--fs-mono); color: var(--led); letter-spacing: 1px;\n  padding: 5px 8px; border-radius: 6px; background: rgba(56,226,138,.07);\n  box-shadow: inset 0 0 0 1px rgba(56,226,138,.24); text-shadow: 0 0 6px rgba(40,200,120,.3);\n}\n.doc-section > h2 .rule { flex: 1 1 auto; height: 1px; background: linear-gradient(90deg, var(--edge-light), rgba(255,255,255,0)); box-shadow: 0 1px 0 rgba(0,0,0,.5); }\n.doc h3 { margin: 22px 0 8px; font: 700 18px/1.3 var(--fs-display); letter-spacing: -.2px; color: #eef1f2; }\n.doc p { margin: 0 0 12px; font: 400 15.5px/1.7 var(--fs-display); color: var(--txt-2); text-wrap: pretty; }\n.doc p.muted { color: var(--txt-dim); }\n.doc a { color: var(--led); text-decoration: none; border-bottom: 1px solid rgba(56,226,138,.3); transition: border-color .15s; }\n.doc a:hover { border-color: var(--led); }\n.doc strong { color: #eef1f2; font-weight: 700; }\n.doc ul { margin: 4px 0 14px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }\n.doc ul li {\n  position: relative; padding-left: 22px;\n  font: 400 15px/1.6 var(--fs-display); color: var(--txt-2);\n}\n.doc ul li::before {\n  content: \"\"; position: absolute; left: 4px; top: 11px;\n  width: 6px; height: 6px; border-radius: 50%;\n  background: radial-gradient(circle at 36% 30%, #8fe9bd, var(--led-deep) 70%);\n  box-shadow: 0 0 5px rgba(40,200,120,.4);\n}\n\n/* recessed tray for emphasised blocks */\n.doc-panel {\n  margin: 18px 0; padding: 22px 24px; border-radius: 16px;\n  background: linear-gradient(180deg, var(--recess-lo), var(--recess-hi));\n  box-shadow: inset 0 2px 6px rgba(0,0,0,.82), inset 0 -1px 0 var(--edge-soft), 0 1px 0 var(--edge-light);\n}\n.doc-panel.lit {\n  background: linear-gradient(180deg, #0d1411, #0a0f0d);\n  box-shadow: inset 0 1px 0 rgba(56,226,138,.16), inset 0 -2px 5px rgba(0,0,0,.7), 0 0 22px rgba(40,200,120,.08), 0 0 0 1px rgba(56,226,138,.14);\n}\n.doc-panel > h3:first-child { margin-top: 0; }\n/* marked list: × (not collected) / ✓ (benefit) in recessed wells */\n.mark-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 11px; }\n.mark-list li { display: flex; align-items: flex-start; gap: 13px; font: 400 15px/1.5 var(--fs-display); color: var(--txt-2); padding: 0; }\n.mark-list li::before { content: none; }\n.mark-list .mk {\n  flex: 0 0 auto; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;\n  background: linear-gradient(180deg, #090a0b, #131517);\n  box-shadow: inset 0 2px 4px rgba(0,0,0,.85), inset 0 -1px 0 var(--edge-soft);\n}\n.mark-list .mk svg { width: 13px; height: 13px; }\n.mark-list .mk.no { color: var(--txt-dim); }\n.mark-list .mk.yes { color: var(--led); box-shadow: inset 0 2px 4px rgba(0,0,0,.85), inset 0 0 0 1px rgba(56,226,138,.22), 0 0 9px rgba(40,200,120,.16); }\n\n/* contact key + callout */\n.doc-cta { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 6px 0 4px; }\n\n/* FAQ accordion — engraved channel rows */\n.faq { margin-top: 8px; border-radius: 16px; overflow: hidden;\n  background: linear-gradient(180deg, var(--recess-lo), var(--recess-hi));\n  box-shadow: inset 0 2px 6px rgba(0,0,0,.82), inset 0 -1px 0 var(--edge-soft), 0 1px 0 var(--edge-light); }\n.faq-item { position: relative; }\n.faq-item:not(:last-child)::after { content: \"\"; position: absolute; left: 20px; right: 20px; bottom: 0; height: 1px; background: rgba(0,0,0,.55); box-shadow: 0 1px 0 var(--edge-soft); }\n.faq-q {\n  width: 100%; border: none; background: none; cursor: pointer; text-align: left;\n  display: flex; align-items: center; gap: 14px; padding: 19px 22px;\n  font: 700 17px/1.3 var(--fs-display); letter-spacing: -.1px; color: #eaedee;\n  transition: background .15s;\n}\n.faq-q:hover { background: rgba(255,255,255,.018); }\n.faq-q .q-led { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%;\n  background: radial-gradient(circle at 35% 30%, #1d2a23, #0c130f);\n  box-shadow: inset 0 1px 1px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.04); transition: background .25s, box-shadow .25s; }\n.faq-q .q-text { flex: 1 1 auto; }\n.faq-q .q-chev { flex: 0 0 auto; color: var(--txt-dim); transition: transform .25s; }\n.faq-item.open .faq-q .q-chev { transform: rotate(90deg); }\n.faq-item.open .faq-q { color: #fff; }\n.faq-item.open .faq-q .q-led { background: radial-gradient(circle at 35% 30%, #aaffd2, var(--led) 55%, var(--led-deep)); box-shadow: 0 0 7px var(--led-glow), 0 0 14px rgba(40,200,120,.4); }\n.faq-a { max-height: 0; overflow: hidden; transition: max-height .3s ease; }\n.faq-item.open .faq-a { max-height: 320px; }\n.faq-a p { margin: 0; padding: 0 22px 20px 50px; font: 400 15px/1.65 var(--fs-display); color: var(--txt-dim); }\n\n.doc-foot-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 30px; font: 600 12px/1 var(--fs-mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--txt-dim); text-decoration: none; transition: color .15s; }\n.doc-foot-link:hover { color: var(--led); }\n\n@media (max-width: 640px) {\n  .faq-a p { padding-left: 22px; }\n}\n\n/* ============================================================\n   RESPONSIVE\n   ============================================================ */\n@media (max-width: 920px) {\n  .hero-a .fa
